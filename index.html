<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tip Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f9f9f9; }
    .card { max-width: 500px; margin: auto; padding: 1.5rem; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 8px; }
    button { margin-top: 1rem; padding: 0.7rem; width: 100%; border: 1px solid #333; border-radius: 8px; background: #fff; cursor: pointer; }
    button:hover { background: #f5f5f5; }
    .result { margin-top: 1rem; padding: 0.75rem; background: #fafafa; border: 1px solid #eee; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💵 Tip Calculator</h1>

    <label for="bill">Bill Amount ($):</label>
    <input id="bill" type="number" min="0" step="0.01">

    <label for="tip">Tip Percentage (%):</label>
    <input id="tip" type="number" min="0" step="1" value="15">

    <label for="people">Number of People:</label>
    <input id="people" type="number" min="1" value="1">

    <button onclick="calculateTip()">Calculate</button>

    <div class="result" id="output">Enter values and click Calculate</div>
  </div>

  <script>
    function calculateTip() {
      const bill = parseFloat(document.getElementById("bill").value) || 0;
      const tipPercent = parseFloat(document.getElementById("tip").value) || 0;
      const people = parseInt(document.getElementById("people").value) || 1;

      const tip = bill * (tipPercent / 100);
      const total = bill + tip;
      const perPerson = total / people;

      document.getElementById("output").textContent = 
        `Tip: $${tip.toFixed(2)}\nTotal: $${total.toFixed(2)}\nPer Person: $${perPerson.toFixed(2)}`;
    }
  </script>
</body>
</html>
